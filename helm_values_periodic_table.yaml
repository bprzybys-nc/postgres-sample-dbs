# Database periodic_table removed via automated decommission
# Original references commented out for safety
# Applied Windsurf rules from: .windsurf/rules/helm_refac.md

# helm-charts/periodic_table/values.yaml
# Kubernetes deployment configuration for # REMOVED: "periodic_table" database
# Scenario: CONFIG_ONLY | Criticality: LOW

# Global configuration
global:
  database:
    name: "# REMOVED: "periodic_table""
    scenario: "config_only"
    criticality: "low"

  # Image registry settings
  imageRegistry: "registry.company.com"
  storageClass: "premium-ssd"

# PostgreSQL configuration
postgresql:
  enabled: true

  # Database connection settings
  auth:
    postgresPassword: ""  # Will be set via secret
    username: "dbuser"
    password: ""  # Will be set via secret
    database: "# REMOVED: "periodic_table""

  # Primary server configuration
  primary:
    name: "primary"

    # Resource allocation based on criticality
    resources:
      requests:
        cpu: '250m'
        memory: '1Gi'
      limits:
        cpu: '500m'
        memory: '2Gi'

    # Storage configuration  
    persistence:
      enabled: true
      size: 20Gi
      storageClass: standard-ssd
      accessModes:
        - ReadWriteOnce

    # PostgreSQL configuration parameters
    postgresqlConfiguration:
      max_connections: 50
      shared_buffers: 256MB
      effective_cache_size: 768MB
      work_mem: 8MB

      # Logging configuration for monitoring
      log_statement: "all"  # Log all statement
on management
  helm.sh/hook-weight: "0"

# Environment-specific overrides
environments:
  development:
    postgresql:
      primary:
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "500m" 
            memory: "2Gi"
        persistence:
          size: "10Gi"

  staging:
    postgresql:
      primary:
        resources:
          requests:
            cpu: '500m'
            memory: '1Gi'
          limits:
            cpu: '1000m'
            memory: '2Gi'
        persistence:
          size: 25Gi

  production:
    # Use default values defined above
    postgresql:
      primary:
        nodeSelector:
          database-tier: 'standard'
        tolerations:
        - key: "database"
          operator: "Equal"
          value: "low"
          effect: "NoSchedule"

# Health checks and probes
healthChecks:
  livenessProbe:
    enabled: true
    exec:
      command:
        - /bin/bash
        - -ec
        - 'PGPASSWORD=$POSTGRES_PASSWORD psql -w -U "dbuser" -d "# REMOVED: "periodic_table"" -h 127.0.0.1 -c "SELECT 1"'
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    exec:
      command:
        - /bin/bash
        - -ec
        - 'PGPASSWORD=$POSTGRES_PASSWORD psql -w -U "dbuser" -d "# REMOVED: "periodic_table"" -h 127.0.0.1 -c "SELECT 1"'
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
