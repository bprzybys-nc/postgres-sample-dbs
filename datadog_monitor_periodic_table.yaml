# Database periodic_table removed via automated decommission
# Original references commented out for safety
# Applied Windsurf rules from: .windsurf/rules/helm_refac.md

# monitoring/database-monitors/periodic_table_monitor.yaml
# Datadog monitoring configuration for # REMOVED: "periodic_table" database
# Scenario: CONFIG_ONLY | Criticality: LOW

api_version: v1
kind: Monitor
metadata:
  name: "# REMOVED: "periodic_table"-database-connection-monitor"
  tags:
    - "database:# REMOVED: "periodic_table""
    - "scenario:config_only"
    - "criticality:low"
    - "environment:multi"
    - "service:database-monitoring"
    - "team:chemistry_team"

spec:
  # Database connection monitoring
  type: "query alert"

  query: |
    max(last_30m):max:postgresql.connections.active{database:# REMOVED: "periodic_table"} by {host}

  name: "Periodic_Table Database - Unused Connection Alert"

  message: |
    **🔍 Database Decommissioning Candidate Detected**

    Database: # REMOVED: "periodic_table"
    Scenario Type: CONFIG_ONLY
    Criticality: LOW

    **Alert Details:**
    - No active connections detected for {{#is_alert}}{{ value }}{{/is_alert}} seconds
    - Threshold: 2592000 seconds (30.0 days)
    - Owner: chemistry-team@company.com

    **Next Steps:**
    
    
    ⚙️ Config-only scenario - Safe for automated review

    **Decommissioning Workflow:**
    1. Verify no hidden dependencies
    2. Contact owner: chemistry-team@company.com
    3. Evaluate for removal
    4. Document decision and ra
gresql.connections.active{database:# REMOVED: "periodic_table"}"
          display_type: "line"
      yaxis:
        min: 0
        max: 100
      markers:
        - value: 720.0  # Show threshold as marker
          display_type: "error dashed"
          label: "Decommissioning Threshold"

# Integration with GitHub for issue creation
github_integration:
  repository: "company/database-decommissioning"
  issue_template: |
    ## Database Decommissioning Review: # REMOVED: "periodic_table"

    **Database Information:**
    - Name: # REMOVED: "periodic_table"
    - Scenario: CONFIG_ONLY
    - Criticality: LOW
    - Owner: chemistry-team@company.com

    **Alert Details:**
    - No connections for {connection_threshold/86400:.0f} days
    - Last activity: {last_activity_timestamp}

    **Required Actions:**
    - [ ] Verify no hidden dependencies
    - [ ] Check application logs for references
    - [ ] Contact database owner
    - [ ] Confirm safe removal
    - [ ] Document decommissioning decision

    **Owner:** @chemistry-team
    **Labels:** database-decommissioning, config_only, low

# Webhook for automated workflows
webhooks:
  - name: "decommissioning_workflow"
    url: "https://automation.company.com/database-decommissioning/webhook"
    payload: |
      {
        "database_name": "# REMOVED: "periodic_table"",
        "scenario_type": "CONFIG_ONLY",
        "criticality": "LOW",
        "owner_email": "chemistry-team@company.com",
        "alert_timestamp": "{{alert_timestamp}}",
        "metric_value": "{{value}}",
        "requires_manual_review": false
      }
